[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "noah-calcutils"
version = "0.1.0"
description = "A simple student tutorial math utility package"
readme = "README.md"
authors = [
    { name = "Noah Igirimpuhwe" }
]
requires-python = ">=3.8"
dependencies = []

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]


[project.urls]
Homepage = "https://github.com/IGIRIMPUHWEnoah/noah-calcutils"